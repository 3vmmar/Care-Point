name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused as the gate in deploy.yml, so a deploy can never skip verification.
  workflow_call:

# A superseded run on the same branch is wasted compute.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, D1, browser, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Test patient and clinic journeys
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Enforce patient performance budget
        run: npm run test:performance

      - name: Test constrained-mobile performance
        run: npm run test:performance:lab

      # The runtime schema in db/bookings.ts and the Drizzle migrations describe
      # the same table. If schema.ts changes without a matching migration, this
      # leaves a dirty tree and fails — which is the only reliable way to stop
      # the two drifting apart.
      - name: Check migrations are up to date
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::db/schema.ts changed without a generated migration. Run 'npm run db:generate' and commit the result."
            git status --porcelain drizzle
            exit 1
          fi

      - name: Preserve browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
