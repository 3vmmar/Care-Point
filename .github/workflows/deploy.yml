name: Deploy

# Staging deploys automatically from main. Production is manual and gated on a
# GitHub Environment, so putting a change in front of patients is always a
# deliberate act by a named person.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  staging:
    name: Deploy to staging
    needs: verify
    if: github.event_name == 'push' || inputs.target == 'staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Migrations run before the code that depends on them. They are additive
      # by design (see docs/RUNBOOK.md) so a rollback of the Worker does not
      # strand the database.
      - name: Apply migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Build and deploy
        run: npm run deploy -- --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          ENVIRONMENT: staging
          RELEASE: ${{ github.sha }}

      - name: Smoke test
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            body=$(curl -fsS "${{ vars.SITE_URL }}/api/health" || true)
            echo "$body"
            status=$(printf '%s' "$body" | grep -o '"status":"[a-z]*"' | head -1 || true)
            if [ -n "$status" ] && [ "$status" != '"status":"unhealthy"' ]; then
              echo "health ok"; exit 0
            fi
            sleep 10
          done
          echo "::error::staging did not become healthy"; exit 1

  production:
    name: Deploy to production
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: ubuntu-latest
    # Configure this GitHub Environment with required reviewers. That approval
    # gate is the last thing standing between a bad merge and the clinic's
    # appointment book.
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify doctor-controlled content approvals
        run: npm run check:launch-content

      # A pre-deploy export is the difference between a bad migration being an
      # inconvenience and it being a lost appointment book.
      # `--no-owner --no-acl` so the dump restores into a fresh managed database
      # that will not have the same role names. `set -o pipefail` matters: without
      # it a failing pg_dump piped anywhere still exits 0, and the gate that is
      # supposed to guarantee a backup silently passes without one.
      - name: Back up the database first
        run: |
          set -euo pipefail
          mkdir -p backup
          pg_dump --no-owner --no-acl --format=plain \
            --file="backup/pre-deploy-$(date -u +%Y%m%dT%H%M%SZ).sql" \
            "$DATABASE_URL"
          test -s backup/*.sql
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-backup-${{ github.sha }}
          path: backup/
          retention-days: 30

      - name: Apply migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Build and deploy
        run: npm run deploy -- --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          ENVIRONMENT: production
          RELEASE: ${{ github.sha }}

      - name: Smoke test
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            body=$(curl -fsS "${{ vars.SITE_URL }}/api/health" || true)
            echo "$body"
            case "$body" in
              *'"status":"ok"'*)       echo "healthy";  exit 0 ;;
              *'"status":"degraded"'*) echo "::warning::deployed but degraded — check /api/health"; exit 0 ;;
            esac
            sleep 10
          done
          echo "::error::production did not become healthy — roll back per docs/RUNBOOK.md"
          exit 1
